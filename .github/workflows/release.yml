name: Release

# Builds the installable plugin ZIP, installs it into a real WordPress site to
# prove it works, and publishes it as a GitHub release.
#
# - Pull requests to main: build and smoke test only.
# - Push a tag vX.Y.Z: build, smoke test, publish release vX.Y.Z.
# - Manual run (Actions > Release > Run workflow): build and smoke test the
#   chosen branch. Tick "publish" on main to tag and release the version in the
#   plugin header.

on:
  pull_request:
    branches: [ main ]
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Tag and publish a GitHub release for the plugin header version (main only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLUGIN_SLUG: who-team-manager

jobs:
  build:
    name: Build ZIP
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version
        id: version
        env:
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$(bin/check-version.sh "${GITHUB_REF_NAME#v}")"
          else
            version="$(bin/check-version.sh)"
          fi

          if [[ "$PUBLISH" == "true" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Publishing is only allowed from main, not $GITHUB_REF."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "::error::Tag v$version already exists. Bump the version before publishing."
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=$PLUGIN_SLUG-$version" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build block assets
        run: npm run build

      - name: Build plugin ZIP
        run: bin/build-zip.sh

      - name: Write checksum and release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd dist && sha256sum "$PLUGIN_SLUG.zip" > "$PLUGIN_SLUG.zip.sha256")

          # Copy this version's entry from the readme.txt changelog.
          awk -v heading="= $VERSION =" '
            $0 == heading { found = 1; next }
            found && /^(=|==) / { exit }
            found { print }
          ' readme.txt > dist/release-notes.md

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            dist/${{ env.PLUGIN_SLUG }}.zip
            dist/${{ env.PLUGIN_SLUG }}.zip.sha256
            dist/release-notes.md
          if-no-files-found: error

  smoke-test:
    name: Install test (WP ${{ matrix.wp }}, PHP ${{ matrix.php }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported pair from the plugin header.
          - wp: '6.0'
            php: '7.4'
          - wp: 'latest'
            php: '8.3'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      WP_CLI_ALLOW_ROOT: '1'
      VERSION: ${{ needs.build.outputs.version }}
    defaults:
      run:
        working-directory: wp
    steps:
      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: wp-cli
          coverage: none

      - name: Install WordPress
        working-directory: .
        run: |
          mkdir wp
          cd wp
          wp core download --version="${{ matrix.wp }}" --quiet
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp config set WP_DEBUG true --raw
          wp config set WP_DEBUG_LOG "'$PWD/debug.log'" --raw
          wp config set WP_DEBUG_DISPLAY false --raw
          wp core install --url=http://localhost --title=Smoke --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
          wp core version --extra

      - name: Install and activate plugin from ZIP
        run: |
          wp plugin install "$GITHUB_WORKSPACE/dist/$PLUGIN_SLUG.zip" --activate
          wp plugin is-active "$PLUGIN_SLUG"
          test -f "wp-content/plugins/$PLUGIN_SLUG/$PLUGIN_SLUG.php"

      - name: Check installed version
        run: |
          installed="$(wp plugin get "$PLUGIN_SLUG" --field=version)"
          echo "Installed version: $installed"
          test "$installed" = "$VERSION"

      - name: Check post type and block registration
        run: |
          wp eval '
            if ( ! post_type_exists( \WhoTeamManager\Team_Member_CPT::POST_TYPE ) ) {
              WP_CLI::error( "Team member post type is not registered." );
            }
            if ( ! WP_Block_Type_Registry::get_instance()->is_registered( "who-team-manager/team-grid" ) ) {
              WP_CLI::error( "Team Grid block is not registered." );
            }
            WP_CLI::success( "Post type and block are registered." );
          '

      - name: Render the Team Grid block
        run: |
          post_type="$(wp eval 'echo \WhoTeamManager\Team_Member_CPT::POST_TYPE;')"
          wp post create --post_type="$post_type" --post_title="Smoke Test Member" --post_status=publish
          output="$(wp eval 'echo do_blocks( "<!-- wp:who-team-manager/team-grid /-->" );')"
          echo "$output"
          grep -q "Smoke Test Member" <<< "$output"

      - name: Uninstall plugin and check cleanup
        run: |
          wp plugin uninstall "$PLUGIN_SLUG" --deactivate
          test ! -e "wp-content/plugins/$PLUGIN_SLUG"
          remaining="$(wp post list --post_type=who_team_member --post_status=any --format=count)"
          echo "Team member posts left after uninstall: $remaining"
          test "$remaining" = "0"

      - name: Fail on PHP notices from the plugin
        if: always()
        working-directory: .
        run: |
          if [[ -f wp/debug.log ]]; then
            cat wp/debug.log
            if grep -q "plugins/$PLUGIN_SLUG/" wp/debug.log; then
              echo "::error::The plugin logged PHP errors, warnings or notices."
              exit 1
            fi
          fi

  release:
    name: Publish release
    needs: [ build, smoke-test ]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    # A manual run on main and a tag push for the same version use different
    # refs, so the workflow-level group doesn't serialize them. Lock on the
    # version so only one run writes a given release at a time.
    concurrency:
      group: publish-v${{ needs.build.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Create or update GitHub release
        run: |
          assets=( "dist/$PLUGIN_SLUG.zip" "dist/$PLUGIN_SLUG.zip.sha256" )

          # Never attach this commit's ZIP to a tag on another commit. That
          # happens when a competing run published this version first, or the
          # tag was moved after this run started. Same-commit retries pass.
          tag_count="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" \
            --jq "[.[] | select(.ref == \"refs/tags/$TAG\")] | length")"
          if [[ "$tag_count" != "0" ]]; then
            tag_sha="$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha)"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::$TAG points at $tag_sha, but this run built $GITHUB_SHA. Bump the version or delete the tag."
              exit 1
            fi
          fi

          # The release can already exist in two cases:
          # - It was made by hand in the GitHub UI, which pushed the tag that
          #   started this run.
          # - An earlier run was interrupted. `gh release create` makes a
          #   draft, uploads assets, then publishes, so it can leave a draft.
          # Attach the assets, then publish it if it is still a draft.
          if is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            if [[ "$is_draft" == "true" ]]; then
              publish=( --draft=false )
              # A manual run creates the tag on publish. Point it at this
              # run's commit, not the commit the abandoned draft recorded.
              if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
                publish+=( --target "$GITHUB_SHA" )
              fi
              gh release edit "$TAG" "${publish[@]}"
            fi
            exit 0
          fi

          args=(
            --title "WHO Team Manager $TAG"
            --notes-file dist/release-notes.md
            --generate-notes
          )
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            args+=( --verify-tag )
          else
            args+=( --target "$GITHUB_SHA" )
          fi

          gh release create "$TAG" "${assets[@]}" "${args[@]}"
